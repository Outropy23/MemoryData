# OpenTelemetry Collector config — MemoryData / Adam Orchestrator
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
  memory_limiter:
    limit_mib: 512
  attributes:
    actions:
      - key: project
        value: memorydata-swarm64
        action: insert
      - key: gotham_version
        value: v3
        action: insert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: adam_orchestrator
  logging:
    loglevel: warn

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
