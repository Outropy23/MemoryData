# Local dev cluster: PostgreSQL 16 + pgvector (Swarm64 DA graceful fallback)
# Gotham v3 Bridge — ItalyWorld R&D / Cesare Semovigo
# Usage: docker-compose -f infra/docker-compose.pg-swarm64.yml up -d

version: '3.9'

services:
  postgres:
    image: ankane/pgvector:v0.7.0
    container_name: memorydata-pg
    environment:
      POSTGRES_USER: adam_agent
      POSTGRES_PASSWORD: localdev_only
      POSTGRES_DB: memorydata_swarm64
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: >
      postgres
        -c max_parallel_workers_per_gather=8
        -c max_parallel_workers=16
        -c work_mem=512MB
        -c shared_buffers=4GB
        -c effective_cache_size=12GB
        -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adam_agent -d memorydata_swarm64"]
      interval: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: memorydata-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
      - "8889:8889"   # Prometheus scrape
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: memorydata-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: memorydata-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: gotham_v3
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pg_data:
  grafana_data:
